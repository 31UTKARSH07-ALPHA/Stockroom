apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockroom.fullname" . }}-postgresql
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
