apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockroom.fullname" . }}-postgresql
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "stockroom.fullname" .) .Values.postgresql.auth.database | quote }}
