adminUser: admin
adminPassword: stockroom-local

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Stockroom
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    stockroom-overview:
      json: |
        {
          "uid": "stockroom-overview",
          "title": "Stockroom API Overview",
          "tags": ["stockroom", "api"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "15s",
          "time": {"from": "now-1h", "to": "now"},
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "HTTP requests per second",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
              "targets": [{"expr": "sum(rate(stockroom_http_requests_total{job=\"stockroom\"}[5m]))", "legendFormat": "requests/sec", "refId": "A"}],
              "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "palette-classic"}}, "overrides": []},
              "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "API latency p95 by route",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
              "targets": [{"expr": "histogram_quantile(0.95, sum by (le, route) (rate(stockroom_http_request_duration_seconds_bucket{job=\"stockroom\"}[5m])))", "legendFormat": "{{route}}", "refId": "A"}],
              "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "palette-classic"}}, "overrides": []},
              "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Requests by route and status",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 9, "w": 24, "x": 0, "y": 9},
              "targets": [{"expr": "sum by (route, status_code) (rate(stockroom_http_requests_total{job=\"stockroom\"}[5m]))", "legendFormat": "{{route}} · {{status_code}}", "refId": "A"}],
              "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "palette-classic"}}, "overrides": []},
              "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}
            }
          ]
        }
